name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: verification page (WebAssembly)
        run: GOOS=js GOARCH=wasm go vet ./web/wasm && web/build.sh /tmp/site
      # The JavaScript implementation: the same conformance vectors as the Go
      # tests above, and each implementation against the other's output.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: JavaScript implementation, against dlog
        run: go build -o /tmp/dlog ./cmd/dlog && cd js && DLOG=/tmp/dlog npm test
      - name: the package holds what it should
        run: cd js && npm pack --dry-run
